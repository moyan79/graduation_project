  category: deepfake
  image_size: 256
  norm: imagenet
  init: {}
  need_deepfake_yaml: sia.yaml
  ddp:
    batch_size: 128
    lr: 0.0004
  feature:
    path: backbone.last_layer
    expected_dim: 1792
    source: input
iml-vit:
  registry: IML_ViT
  category: imdl
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  wrapper_init:
    edge_lambda: 20
  ddp:
    batch_size: 64
    lr: 0.0002
  feature:
    path: base_model.predict_head.linear_fuse
    expected_dim: 256
    source: output
trufor:
  registry: Trufor
  category: imdl
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  wrapper_init: {}
  ddp:
    batch_size: 64
    lr: 0.0002
  feature:
    path: base_model.model.decode_head.linear_fuse
    expected_dim: 512
    source: output
univfd:
