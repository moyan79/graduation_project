  image_size: 256
  norm: deepfake
  init: {}
  need_deepfake_yaml: f3net.yaml
  task_checkpoint: weights/manual/hf_tasks/deepfakebench/f3net_best.pth
  task_checkpoint_target: _base_model
  ddp:
    batch_size: 32
    lr: 0.0001
  feature:
    path: backbone.last_linear
    expected_dim: 2048
