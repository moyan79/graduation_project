# Model definitions shared by training, launch scripts and result inspection.
resnet:
  registry: Resnet101
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
efficientnet:
  registry: EfficientB4
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
capsulenet:
  registry: Capsule_net
  category: deepfake
  image_size: 256
  norm: imagenet
  init: {}
  need_deepfake_yaml: capsule_net.yaml
  ddp:
    batch_size: 128
    lr: 0.0004
segformer:
  registry: Segformerb3
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
swin:
