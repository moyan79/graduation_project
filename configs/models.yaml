# Model definitions shared by training, launch scripts and result inspection.
resnet:
  registry: Resnet101
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
  import_module: ForensicHub.common.backbones.resnet
efficientnet:
  registry: EfficientB4
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
  import_module: ForensicHub.common.backbones.efficientnet
capsulenet:
  registry: Capsule_net
  category: deepfake
  image_size: 256
  norm: imagenet
  init: {}
  need_deepfake_yaml: capsule_net.yaml
  task_norm: deepfake
  ddp:
    batch_size: 128
    lr: 0.0004
  feature:
    path: vgg_ext
    expected_dim: 256
    source: output
segformer:
  registry: Segformerb3
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
  import_module: ForensicHub.common.backbones.segformer
swin:
  registry: SwinSmall
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
  import_module: ForensicHub.common.backbones.swintransformer
convnext:
  registry: ConvNextSmall
  category: backbone
  image_size: 256
  norm: imagenet
  init:
    output_type: label
    image_size: 256
  ddp:
    batch_size: 128
    lr: 0.0004
  import_module: ForensicHub.common.backbones.convnext
recce:
  registry: Recce
  category: deepfake
  image_size: 256
  norm: imagenet
  init: {}
  need_deepfake_yaml: recce.yaml
  ddp:
    batch_size: 128
    lr: 0.0004
sia:
  registry: SIADetector
  category: deepfake
  image_size: 256
  norm: imagenet
  init: {}
  need_deepfake_yaml: sia.yaml
  ddp:
    batch_size: 128
    lr: 0.0004
  feature:
    path: backbone.last_layer
    expected_dim: 1792
    source: input
iml-vit:
  registry: IML_ViT
  category: imdl
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  task_checkpoint: weights/manual/imdl_tasks/iml_vit_casiav2.pth
  task_checkpoint_target: base_model
  wrapper_init:
    edge_lambda: 20
  ddp:
    batch_size: 64
    lr: 0.0002
  feature:
    path: base_model.predict_head.linear_fuse
    expected_dim: 256
    source: output
trufor:
  registry: Trufor
  category: imdl
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  task_checkpoint: weights/manual/imdl_tasks/trufor_casiav2.pth
  task_checkpoint_target: base_model
  wrapper_init: {}
  ddp:
    batch_size: 64
    lr: 0.0002
  feature:
    path: base_model.model.decode_head.linear_fuse
    expected_dim: 512
    source: output
univfd:
  registry: UnivFD
  category: aigc
  image_size: 224
  norm: clip
  init:
    name: ViT-L/14
    num_classes: 1
  task_checkpoint_target: fc
  ddp:
    batch_size: 64
    lr: 0.0002
ffdn:
  registry: FFDN
  category: document
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  wrapper_init: {}
  ddp:
    batch_size: 64
    lr: 0.0002
  input_kind: jpeg_dct
  blocked_reason: Legacy run used zero DCT and unit quantization placeholders and did not complete. A faithful FFDN run requires real JPEG coefficients/tables before it can be counted as this model experiment.
effort:
  registry: EffortDetector
  category: aigc
  image_size: 224
  norm: clip
  init: {}
  need_deepfake_yaml: effort.yaml
  ddp:
    batch_size: 64
    lr: 0.0002
mesorch:
  registry: Mesorch
  category: imdl
  image_size: 256
  norm: imagenet
  init: {}
  wrapper: Mask2LabelWrapper
  task_checkpoint: weights/manual/imdl_tasks/mesorch-98-model.pth
  task_checkpoint_target: base_model
  wrapper_init: {}
  ddp:
    batch_size: 64
    lr: 0.0002
co-spy:
  registry: CO_SPY
  category: aigc
  image_size: 224
  norm: clip
  init:
    clip_model: ViT-L/14
    pretrained: datacomp_xl_s13b_b90k
    dim_clip: 768
  ddp:
    batch_size: 64
    lr: 0.0002

spsl:
  registry: SpslDetector
  category: deepfake
  image_size: 256
  norm: deepfake
  init: {}
  need_deepfake_yaml: spsl.yaml
